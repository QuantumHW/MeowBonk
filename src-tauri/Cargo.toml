[package]
name = "meowbonk"
version = "0.1.0"
description = "MeowBonk 王之蔑视"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
